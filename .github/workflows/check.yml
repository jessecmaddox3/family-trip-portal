name: Check portal
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
          - { os: windows-latest, node: 22 }
          - { os: macos-latest, node: 24 }
    runs-on: ${{ matrix.os }}
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - uses: actions/setup-python@v5
        if: runner.os != 'Linux'
        with:
          python-version: "3.13"
      - run: python scripts/build-release.py
        if: runner.os != 'Linux'
      - run: python scripts/check-launchers.py
        if: runner.os != 'Linux'
  browser-package:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:browser
      - run: python scripts/build-release.py
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /demo
      - run: npm run test:browser
        env:
          PORTAL_TEST_BASE_PATH: /demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portal-checks
          path: artifacts/
